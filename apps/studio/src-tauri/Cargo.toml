[package]
name = "blackboard-studio-desktop"
version = "0.0.25"
description = "Native desktop shell for Blackboard Studio."
authors = ["Blackboard Studio Maintainers"]
edition = "2021"
rust-version = "1.77"
default-run = "blackboard-studio-desktop"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0.0", default-features = false, features = [
  "compression",
  "dynamic-acl",
  "wry",
  "x11",
] }
